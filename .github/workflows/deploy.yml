name: Déployer le site (GitHub Pages)

on:
  # Déploie à chaque push de code sur main
  push:
    branches: [main]
  # Déclenchement manuel possible
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Configurer Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build Astro
        env:
          AMAZON_AFFILIATE_TAG: ${{ vars.AMAZON_AFFILIATE_TAG }}
          AMAZON_DOMAIN: ${{ vars.AMAZON_DOMAIN }}
        run: npm run build
      - name: Upload de l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
